name: Scachs
options:
  bundleIdPrefix: com.jsolee
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ca
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: MUY564KAW3
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    # NEON and dotprod only: no x86_64 slice, not even for the simulator.
    ARCHS: arm64
    # Stockfish's memory.h and search.h must not shadow the system ones through header maps.
    USE_HEADERMAP: NO
targets:
  Stockfish:
    type: library.static
    platform: iOS
    sources:
      - path: Engine/Stockfish/src
        excludes: ["main.cpp", "Makefile", "universal/**", "incbin/UNLICENCE", "**/*.md"]
        headerVisibility: project
      - path: Engine/Bridge
        headerVisibility: project
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_OPTIMIZATION_LEVEL: "3"
        GCC_GENERATE_DEBUGGING_SYMBOLS: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["IS_64BIT=1", "USE_POPCNT=1", "USE_NEON=8", "USE_NEON_DOTPROD=1", "NNUE_EMBEDDING_OFF=1", "NO_TABLEBASES=1", "NDEBUG=1"]
        OTHER_CPLUSPLUSFLAGS: ["-funroll-loops", "-fno-exceptions", "-march=armv8.2-a+dotprod"]
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        CLANG_ENABLE_OBJC_ARC: NO
        SKIP_INSTALL: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
      configs:
        # A few percent of speed for 3-5 s on every app link, so not in Debug.
        Release:
          LLVM_LTO: YES
  Scachs:
    type: application
    platform: iOS
    sources:
      - path: Scachs
      - path: Shared
    dependencies:
      - target: Stockfish
      - target: ScachsWidgets
      - target: ScachsShare
    entitlements:
      path: Scachs/App/Scachs.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jsolee.scachs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsolee.scachs
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Engine/Bridge/Scachs-Bridging-Header.h
        OTHER_LDFLAGS: ["-lc++"]
        MTL_FAST_MATH: YES
    info:
      path: Scachs/App/Info.plist
      properties:
        CFBundleDisplayName: Scachs
        CFBundleDevelopmentRegion: ca
        CFBundleLocalizations: [ca, es, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {UIColorName: Field}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [GrenzeGotisch-Medium.ttf, GrenzeGotisch-Black.ttf, MarcellusSC-Regular.ttf, YsabeauOffice-Regular.ttf, YsabeauOffice-Medium.ttf, YsabeauOffice-SemiBold.ttf]
        UTExportedTypeDeclarations: []
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [com.jsolee.scachs.review]
        UIBackgroundModes: [processing, audio]
  ScachsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ScachsWidgets
      - path: Shared
      - path: Scachs/Localizable.xcstrings
      - path: Scachs/Resources/Pieces
        type: folder
        buildPhase: resources
      - path: Scachs/Resources/Fonts/GrenzeGotisch-Medium.ttf
        buildPhase: resources
      - path: Scachs/Resources/Fonts/YsabeauOffice-SemiBold.ttf
        buildPhase: resources
      - path: Scachs/Resources/Fonts/YsabeauOffice-Medium.ttf
        buildPhase: resources
    entitlements:
      path: ScachsWidgets/ScachsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jsolee.scachs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsolee.scachs.widgets
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: ScachsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scachs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [GrenzeGotisch-Medium.ttf, YsabeauOffice-SemiBold.ttf, YsabeauOffice-Medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ScachsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ScachsShare
      - path: Shared
      - path: Scachs/Localizable.xcstrings
    entitlements:
      path: ScachsShare/ScachsShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jsolee.scachs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsolee.scachs.share
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: ScachsShare/Info.plist
      properties:
        CFBundleDisplayName: Scachs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
  ScachsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Scachs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Scachs.app/Scachs
schemes:
  Scachs:
    build:
      targets:
        Scachs: all
        ScachsTests: [test]
    test:
      targets: [ScachsTests]
      language: ca
      region: ES
