html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; background: #13201D; }

.cap h1 { margin: 0 auto; width: 1180px; font: 150px/1 Grenze; color: #F6F1E6; letter-spacing: -1px; text-wrap: balance; text-shadow: 0 6px 30px rgba(5, 20, 17, .6); }
.cap h1 b { font-weight: inherit; color: #E7B96C; }

</style>
<div id="stage"><svg id="art" width="11880" height="2868"></svg></div>
<script>
const q = new URLSearchParams(location.search);
const LANG = q.get('lang') || 'ca', SLIDE = +(q.get('slide') || 0);
const RAW = 'file://' + (q.get('raw') || ''), ASSETS = 'file://' + (q.get('assets') || '');
const W = 1320, H = 2868, SEA = 2470;
const GOLD = '#E7B96C', TIN = '#F6F1E6', FIELD = '#13201D', RED = '#A42C1C', GREEN = '#2C6F5E', IVORY = '#EBE3CF', INK = '#16121C';

const TEXT = {
  ca: [['Els escacs, per plaer.', 'Puzzles, lliçons i les teves partides, en el tauler més bonic.'],
       ['Aprèn de les teves *partides*', 'Cada dia, el moment que se t\'ha escapat.'],
       ['Cada jugada, *analitzada*', 'Stockfish 19 al teu iPhone, sense connexió.'],
       ['Lliçons que et *corregeixen*', 'Et diuen per què, a l\'instant.'],
       ['De les regles d\'or a la *mestria*', '50 lliçons: tàctica, finals i estratègia.'],
       ['*Vint* obertures, en un arbre', 'Aprèn-les jugant-les de memòria.'],
       ['Exercicis de *finals* i tàctica', 'A la teva mida, de novell a mestre.'],
       ['El *mapa* de les teves obertures', 'I els dracs on sempre perds.'],

       ['Aprende de tus *partidas*', 'Cada día, el momento que se te escapó.'],
       ['Cada jugada, *analizada*', 'Stockfish 19 en tu iPhone, sin conexión.'],
       ['Lecciones que te *corrigen*', 'Te dicen por qué, al instante.'],
       ['De las reglas de oro a la *maestría*', '50 lecciones: táctica, finales y estrategia.'],
       ['*Veinte* aperturas, en un árbol', 'Apréndelas jugándolas de memoria.'],
       ['Ejercicios de *finales* y táctica', 'A tu medida, de novato a maestro.'],
       ['El *mapa* de tus aperturas', 'Y los dragones donde siempre pierdes.'],
       ['¿Qué figura *medieval* eres?', 'Tu escudo, según cómo juegas.']],
  en: [['Chess, for pleasure.', 'Puzzles, lessons and your own games, on the most beautiful board.'],
       ['Learn from your own *games*', 'Every day, the moment you missed.'],
       ['Every move,|*reviewed*', 'Stockfish 19 on your iPhone, offline.'],
       ['Lessons that *correct* you', 'They tell you why, on the spot.'],
       ['From the golden rules to *mastery*', '50 lessons: tactics, endgames and strategy.'],
       ['*Twenty* openings, as a tree', 'Learn them by playing them from memory.'],
       ['Drills for *endgames* and tactics', 'Sized to you, from beginner to master.'],
       ['A *map* of your openings', 'And the dragons where you keep losing.'],
       ['Which *medieval* figure are you?', 'Your coat of arms, from how you play.']],
}[LANG];
const SCENES = ['today', 'review', 'lesson', 'path', 'openings', 'exercises', 'atlas', 'profile'];

const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art');
function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const g = (attrs, parent) => el('g', attrs || {}, parent);
const defs = el('defs', {});
defs.innerHTML = `
  <filter id="enamel" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
    <feSpecularLighting in="b" surfaceScale="7" specularConstant=".8" specularExponent="40" lighting-color="#fff" result="s">
      <feDistantLight azimuth="235" elevation="48"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2="1" k3=".42"/>
  </filter>
  <filter id="wire" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
    <feSpecularLighting in="b" surfaceScale="3" specularConstant="1.1" specularExponent="16" lighting-color="#fff6dc" result="s">
      <feDistantLight azimuth="235" elevation="40"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2=".82" k3=".75"/>
  </filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#04110e" flood-opacity=".6"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="40" stdDeviation="44" flood-color="#030d0b" flood-opacity=".7"/>
  </filter>
  <pattern id="diaper" width="132" height="132" patternUnits="userSpaceOnUse">
    <path d="M0 66 66 0 132 66 66 132Z" fill="none" stroke="${GOLD}" stroke-opacity=".075" stroke-width="2"/>
    <g fill="${GOLD}" fill-opacity=".09"><circle cx="66" cy="58" r="6"/><circle cx="66" cy="74" r="6"/><circle cx="58" cy="66" r="6"/><circle cx="74" cy="66" r="6"/></g>
  </pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#22705f" stop-opacity=".8"/><stop offset="1" stop-color="#22705f" stop-opacity="0"/></radialGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#06201b" stop-opacity="0"/><stop offset="1" stop-color="#06201b" stop-opacity=".75"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a41"/><stop offset="1" stop-color="#05201b"/></linearGradient>
  <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5a60"/><stop offset=".3" stop-color="#26262b"/><stop offset=".7" stop-color="#1b1b1f"/><stop offset="1" stop-color="#4c4c52"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="waxshine" cx=".34" cy=".3" r=".6"><stop offset="0" stop-color="#C9563F" stop-opacity=".7"/><stop offset="1" stop-color="#C9563F" stop-opacity="0"/></radialGradient>`;

// ---------- field ----------
el('rect', { width: 11880, height: H, fill: FIELD });
for (let i = 0; i < 9; i++) el('ellipse', { cx: i * W + 660, cy: 520, rx: 1000, ry: 900, fill: 'url(#glow)' });
el('rect', { width: 11880, height: H, fill: 'url(#diaper)' });
el('rect', { width: 11880, height: H, fill: 'url(#deep)' });

// ---------- geometry ----------
function sample(d, step = 5) {
  const probe = el('path', { d }, defs), L = probe.getTotalLength(), n = Math.max(2, Math.ceil(L / step));
  const P = [];
  for (let i = 0; i <= n; i++) { const p = probe.getPointAtLength(L * i / n); P.push([p.x, p.y]); }
  const T = P.map((_, i) => {
    const a = P[Math.max(i - 1, 0)], b = P[Math.min(i + 1, n)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
    return [dx / m, dy / m];
  });
  return { P, T, L, n };
}
const poly = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];

// A cloisonné serpent body along a path: red back with scales, ivory belly with scutes, a green crest, all in gold wire.
// back = +1 when the tail lies ahead along the path, -1 when it lies behind.
function tube(parent, d, width, back = 1) {
  const { P, T, n } = sample(d), W_ = i => width(i / n);
  const D = T.map(t => [t[1], -t[0]]);
  const dors = P.map((p, i) => add(p, D[i], W_(i) / 2)), bel = P.map((p, i) => add(p, D[i], -W_(i) / 2));
  const belIn = P.map((p, i) => add(p, D[i], -W_(i) / 2 + W_(i) * 0.36));
  const root = g({}, parent);
  const fins = g({ fill: GREEN, stroke: GOLD, 'stroke-width': 6, 'stroke-linejoin': 'round' }, root);
  const every = Math.round(64 / 5);
  for (let i = every; i < n - 4; i += every) {
    const w = W_(i), h = w * 0.46, a = Math.max(0, i - 4), b = Math.min(n, i + 4);
    const tip = add(add(dors[i], D[i], h), T[i], back * h * 0.7);
    el('path', { d: poly([dors[a], tip, dors[b]]) }, fins);
  }
  fins.setAttribute('filter', 'url(#enamel)');
  el('path', { d: poly([...dors, ...bel.slice().reverse()]), fill: RED, filter: 'url(#enamel)' }, root);
  el('path', { d: poly([...belIn, ...bel.slice().reverse()]), fill: IVORY, filter: 'url(#enamel)' }, root);
  const wires = g({ fill: 'none', stroke: GOLD, 'stroke-linecap': 'round', filter: 'url(#wire)' }, root);
  let lines = '';
  for (let i = 3; i < n; i += 5) lines += `M${bel[i][0]} ${bel[i][1]}L${belIn[i][0]} ${belIn[i][1]}`;
  el('path', { d: lines, 'stroke-width': 4 }, wires);
  let scales = '';
  for (let i = 4, row = 0; i < n - 3; i += 6, row++) {
    const w = W_(i), r = w * 0.085;
    for (let f = (row % 2 ? 0.48 : 0.4); f < 0.92; f += 0.17) {
      const c = add(P[i], D[i], -w / 2 + w * f), a = add(c, D[i], r), b = add(c, D[i], -r), k = add(c, T[i], back * r * 1.6);
      scales += `M${a[0]} ${a[1]}Q${k[0]} ${k[1]} ${b[0]} ${b[1]}`;
    }
  }
  el('path', { d: scales, 'stroke-width': 3.2, 'stroke-opacity': .75 }, wires);
  el('path', { d: 'M' + belIn.map(p => p.join(' ')).join('L'), 'stroke-width': 4.5 }, wires);
  el('path', { d: poly([...dors, ...bel.slice().reverse()]), 'stroke-width': 7, 'stroke-linejoin': 'round' }, wires);
  return { P, T, D, n, end: P[n], endT: T[n], start: P[0] };
}

// The head, drawn pointing +x with the neck joining at x = 0 (y from -52 to 52).
function head(parent, at, t, s) {
  const deg = Math.atan2(t[1], t[0]) * 180 / Math.PI;
  const h = g({ transform: `translate(${at[0]} ${at[1]}) rotate(${deg}) scale(${s})`, 'stroke-linejoin': 'round' }, parent);
  const back = g({ filter: 'url(#enamel)' }, h);
  el('path', { d: 'M74 -88C44 -146 -24 -182 -110 -176C-40 -156 4 -118 34 -74Z', fill: IVORY }, back);
  el('path', { d: 'M40 -80C10 -120 -40 -138 -88 -132C-40 -116 -12 -96 6 -66Z', fill: IVORY }, back);
  el('path', { d: 'M24 -60L-46 -96L-16 -74L-72 -76L-14 -48L-64 -40L0 -26Z', fill: GREEN }, back);
  el('path', { d: 'M150 60L156 104L124 58ZM196 68L214 112L174 66Z', fill: GREEN }, back);
  el('path', { d: 'M128 -6L268 -30L238 52Z', fill: '#2a0a07' }, h);
  const teeth = g({ fill: IVORY }, h);
  for (let x = 150; x < 258; x += 17) { const y = -6 - (x - 128) * 0.17; el('path', { d: `M${x} ${y}L${x + 8} ${y + 15}L${x + 14} ${y - 2}Z` }, teeth); }
  for (let x = 150; x < 230; x += 17) { const y = -6 + (x - 128) * 0.53; el('path', { d: `M${x} ${y + 2}L${x + 11} ${y - 12}L${x + 14} ${y + 8}Z` }, teeth); }
  el('path', { d: 'M140 2C200 14 262 4 300 -8L326 -26M300 -8L330 4', fill: 'none', stroke: '#C9563F', 'stroke-width': 9, 'stroke-linecap': 'round' }, h);
  const front = g({ filter: 'url(#enamel)' }, h);
  el('path', { d: 'M0 -52C18 -80 52 -98 92 -98C128 -98 150 -86 176 -78C206 -70 238 -68 262 -60C282 -54 292 -40 280 -30L268 -30L128 -6L60 8L0 10Z', fill: RED }, front);
  el('path', { d: 'M0 52C40 60 84 58 120 48C160 60 204 70 244 74C256 66 250 56 238 52L128 -6L60 8L0 10Z', fill: RED }, front);
  el('path', { d: 'M8 44C40 50 82 48 118 38C150 48 190 58 230 62', fill: 'none', stroke: IVORY, 'stroke-width': 14, 'stroke-linecap': 'round' }, front);
  const wires = g({ fill: 'none', stroke: GOLD, 'stroke-width': 6, filter: 'url(#wire)', 'stroke-linecap': 'round' }, h);
  el('path', { d: 'M74 -88C44 -146 -24 -182 -110 -176C-40 -156 4 -118 34 -74ZM40 -80C10 -120 -40 -138 -88 -132C-40 -116 -12 -96 6 -66Z' }, wires);
  el('path', { d: 'M24 -60L-46 -96L-16 -74L-72 -76L-14 -48L-64 -40L0 -26ZM150 60L156 104L124 58ZM196 68L214 112L174 66Z', 'stroke-width': 4.5 }, wires);
  el('path', { d: 'M0 -52C18 -80 52 -98 92 -98C128 -98 150 -86 176 -78C206 -70 238 -68 262 -60C282 -54 292 -40 280 -30L268 -30L128 -6' }, wires);
  el('path', { d: 'M128 -6L238 52C250 56 256 66 244 74C204 70 160 60 120 48C84 58 40 60 0 52' }, wires);
  el('path', { d: 'M126 -72Q162 -98 200 -74M232 -50q10 -10 18 -2q4 8 -6 10', 'stroke-width': 5 }, wires);
  el('path', { d: 'M40 -40q16 -10 30 0M64 -22q16 -10 30 0M30 -10q16 -10 30 0', 'stroke-width': 3.5, 'stroke-opacity': .8 }, wires);
  el('path', { d: 'M-2 -56Q-12 0 -2 56M10 -58Q0 0 10 58', 'stroke-width': 7 }, wires);
  el('path', { d: 'M140 -60Q162 -78 188 -62Q162 -46 140 -60Z', fill: GOLD, stroke: '#7a5420', 'stroke-width': 3 }, h);
  el('ellipse', { cx: 163, cy: -61, rx: 3.6, ry: 10, fill: INK }, h);
}

function spade(parent, at, t, s) {
  const deg = Math.atan2(t[1], t[0]) * 180 / Math.PI;
  const k = g({ transform: `translate(${at[0]} ${at[1]}) rotate(${deg}) scale(${s})` }, parent);
  const d = 'M-6 -10L18 -58C52 -44 94 -12 124 0C94 12 52 44 18 58L-6 10Z';
  el('path', { d, fill: RED, filter: 'url(#enamel)' }, k);
  el('path', { d, fill: 'none', stroke: GOLD, 'stroke-width': 6, 'stroke-linejoin': 'round', filter: 'url(#wire)' }, k);
  el('path', { d: 'M10 0L100 0M30 -30L60 0L30 30', fill: 'none', stroke: GOLD, 'stroke-width': 4, filter: 'url(#wire)' }, k);
}

const arch = (x0, x1, h) => `M${x0} ${SEA + 90}C${x0 + 10} ${SEA - h * 1.33} ${x1 - 10} ${SEA - h * 1.33} ${x1} ${SEA + 90}`;
const even = w => () => w;

// ---------- the phone ----------
function phone(parent, cx, top, scene, sw = 1010) {
  const sh = sw * 2622 / 1206, b = 26, x = cx - sw / 2 - b, y = top;
  const p = g({ filter: 'url(#soft)' }, parent);
  el('rect', { x: x - 4, y: y - 4, width: sw + 2 * b + 8, height: sh + 2 * b + 8, rx: 176, fill: 'none', stroke: GOLD, 'stroke-width': 4, 'stroke-opacity': .85 }, p);
  el('rect', { x, y, width: sw + 2 * b, height: sh + 2 * b, rx: 172, fill: 'url(#ti)' }, p);
  el('rect', { x: x + 7, y: y + 7, width: sw + 2 * b - 14, height: sh + 2 * b - 14, rx: 165, fill: '#050506' }, p);
  const clip = el('clipPath', { id: 'scr' + cx }, defs);
  el('rect', { x: x + b, y: y + b, width: sw, height: sh, rx: 146 }, clip);
  el('image', { href: `${RAW}/${LANG}-${scene}.png`, x: x + b, y: y + b, width: sw, height: sh, 'clip-path': `url(#scr${cx})`, preserveAspectRatio: 'none' }, p);
  el('rect', { x: cx - 128, y: y + b + 30, width: 256, height: 76, rx: 38, fill: '#030304' }, p);
  el('rect', { x: x + b, y: y + b, width: sw, height: sh, rx: 146, fill: 'url(#glass)' }, p);
  for (const [bx, by, bh] of [[x - 6, y + 420, 120], [x - 6, y + 580, 200], [x - 6, y + 820, 200], [x + sw + 2 * b, y + 640, 300]])
    el('rect', { x: bx, y: by, width: 6, height: bh, rx: 3, fill: '#3a3a40' }, p);
}

function piece(parent, name, x, y, h, flip = false) {
  const ratio = { wk: 660 / 990, bk: 660 / 990, bq: 714 / 913, wn: 708 / 904, bn: 708 / 904, wr: 660 / 723, bb: 660 / 887, wp: 660 / 699 }[name];
  const w = h * ratio, holder = g({ filter: 'url(#lift)' }, parent);
  el('image', { href: `${ASSETS}/${name}.png`, x, y, width: w, height: h, transform: flip ? `translate(${2 * x + w} 0) scale(-1 1)` : '' }, holder);
}

function seal(parent, cx, cy, size, numeral, seed) {
  const r = size / 2, lobes = 14, pts = [];
  for (let i = 0; i < lobes; i++) {
    const wob = Math.sin((seed % 997) * 0.37 + i * 2.1) * 0.5 + 0.5, reach = r * (0.9 + 0.1 * wob), a = i / lobes * 2 * Math.PI;
    pts.push([cx + reach * Math.cos(a), cy + reach * Math.sin(a)]);
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let d = 'M' + mid(pts[lobes - 1], pts[0]).join(' ');
  for (let i = 0; i < lobes; i++) d += 'Q' + pts[i].join(' ') + ' ' + mid(pts[i], pts[(i + 1) % lobes]).join(' ');
  const s = g({ filter: 'url(#lift)' }, parent);
  el('path', { d: d + 'Z', fill: RED, filter: 'url(#enamel)' }, s);
  el('path', { d: d + 'Z', fill: 'url(#waxshine)' }, s);
  el('circle', { cx, cy, r: r * 0.7, fill: 'none', stroke: '#6B1A10', 'stroke-width': size * 0.03 }, s);
  el('circle', { cx: cx + size * .008, cy: cy + size * .012, r: r * 0.7, fill: 'none', stroke: '#C9563F', 'stroke-opacity': .6, 'stroke-width': size * 0.012 }, s);
  const t = el('text', { x: cx + size * .006, y: cy + size * 0.1 + size * .01, 'text-anchor': 'middle', 'font-family': 'Ysabeau', 'font-weight': 600, 'font-size': size * 0.27, fill: '#C9563F', 'fill-opacity': .7 }, s);
  t.textContent = numeral;
  const u = el('text', { x: cx, y: cy + size * 0.1, 'text-anchor': 'middle', 'font-family': 'Ysabeau', 'font-weight': 600, 'font-size': size * 0.27, fill: '#6B1A10' }, s);
  u.textContent = numeral;
}

function rose(parent, cx, cy, R) {
  const r = g({ filter: 'url(#lift)' }, parent);
  el('circle', { cx, cy, r: R * 0.74, fill: '#0b2f29', 'fill-opacity': .55, stroke: GOLD, 'stroke-width': 5 }, r);
  el('circle', { cx, cy, r: R * 0.68, fill: 'none', stroke: GOLD, 'stroke-width': 2.5, 'stroke-opacity': .7 }, r);
  const kite = (a, len, wid, left, right) => {
    const tip = [cx + len * Math.cos(a), cy + len * Math.sin(a)];
    const l = [cx + wid * Math.cos(a - Math.PI / 2), cy + wid * Math.sin(a - Math.PI / 2)], rr = [cx + wid * Math.cos(a + Math.PI / 2), cy + wid * Math.sin(a + Math.PI / 2)];
    el('path', { d: poly([[cx, cy], l, tip]), fill: left, stroke: GOLD, 'stroke-width': 3 }, r);
    el('path', { d: poly([[cx, cy], rr, tip]), fill: right, stroke: GOLD, 'stroke-width': 3 }, r);
  };
  for (let i = 1; i < 16; i += 2) kite(i / 16 * 2 * Math.PI - Math.PI / 2, R * 0.6, R * 0.05, RED, '#6B1A10');
  for (let i = 1; i < 8; i += 2) kite(i / 8 * 2 * Math.PI - Math.PI / 2, R * 0.8, R * 0.09, GREEN, IVORY);
  for (let i = 0; i < 8; i += 2) kite(i / 8 * 2 * Math.PI - Math.PI / 2, R, R * 0.12, GOLD, '#a87a3a');
  el('circle', { cx, cy, r: R * 0.07, fill: RED, stroke: GOLD, 'stroke-width': 4 }, r);
}

function shield(parent, x, y, w) {
  const h = w * 1.18;
  const d = `M${x} ${y}H${x + w}V${y + h * .42}C${x + w} ${y + h * .78} ${x + w / 2 + w * .22} ${y + h * .94} ${x + w / 2} ${y + h}C${x + w / 2 - w * .22} ${y + h * .94} ${x} ${y + h * .78} ${x} ${y + h * .42}Z`;
  const s = g({ filter: 'url(#lift)' }, parent);
  el('path', { d, fill: RED, filter: 'url(#enamel)' }, s);
  const m = el('mask', { id: 'charge' }, defs);
  el('image', { href: `${ASSETS}/fign.png`, x: x + w * .22, y: y + h * .12, width: w * .56, height: w * .56 * 904 / 708 }, m);
  el('rect', { x, y, width: w, height: h, fill: GOLD, mask: 'url(#charge)', filter: 'url(#wire)' }, s);
  el('path', { d, fill: 'none', stroke: GOLD, 'stroke-width': 12, filter: 'url(#wire)' }, s);
}

// ---------- the sea serpent, slides 1 to 3 ----------
const back = g(), phones = g(), front = g(), sea = g(), top_ = g();

// slide 1: the king, and the serpent rising behind it
piece(back, 'wk', 790 - 280, 1740, 840);
const neck = tube(back, `M290 ${SEA + 120}C240 2150 150 1650 320 1340S640 1150 690 1290`, u => 180 - 40 * u, -1);
head(back, neck.end, neck.endT, 1.45);
tube(back, arch(1000, 1340, 330), even(140));
// slide 2
tube(back, arch(2440, 2790, 400), even(140));
phone(phones, 1980, 690, 'today');
tube(front, arch(1700, 2060, 270), even(136));
// slide 3
phone(phones, 3300, 690, 'review');
tube(front, arch(2960, 3290, 250), even(128));
const tail = tube(front, `M3530 ${SEA + 120}C3560 2250 3880 2200 3860 1900S3640 1600 3700 1500`, u => 126 - 96 * u);
spade(front, tail.end, tail.endT, 1.05);

// the sea, with rows of waves in gold wire, ending at the edge of slide 3
let crest = `M0 ${SEA}`;
for (let x = 0; x < 3960; x += 120) crest += `Q${x + 60} ${SEA - 26} ${x + 120} ${SEA}`;
el('path', { d: `${crest}V${H}H0Z`, fill: 'url(#sea)' }, sea);
const waves = g({ fill: 'none', stroke: GOLD, 'stroke-linecap': 'round', filter: 'url(#wire)' }, sea);
el('path', { d: crest, 'stroke-width': 7 }, waves);
for (let row = 0; row < 6; row++) {
  const y = SEA + 70 + row * 62, off = (row % 2) * 60;
  let d = '';
  for (let x = -60 + off; x < 3960; x += 120) d += `M${x} ${y}q30 -30 60 0q-14 -16 -26 -2`;
  el('path', { d, 'stroke-width': 5 - row * 0.5, 'stroke-opacity': 0.85 - row * 0.12 }, waves);
}

// ---------- slides 4 to 9 ----------
const X = i => i * W;
// Each slide's ornaments stay inside their own slide.
function own(parent, i) {
  const c = el('clipPath', { id: 'slide' + i }, defs);
  el('rect', { x: X(i), y: 0, width: W, height: H }, c);
  return g({ 'clip-path': `url(#slide${i})` }, parent);
}
phone(phones, X(3) + 660, 650, 'lesson');
seal(own(top_, 3), X(3) + 1110, 760, 330, 'I', 3);
seal(own(top_, 3), X(3) + 150, 2770, 230, 'IV', 11);

phone(phones, X(4) + 660, 690, 'path');
piece(own(top_, 4), 'wp', X(4) + 10, 2400, 440);
piece(own(top_, 4), 'bk', X(4) + 955, 1480, 520);

phone(phones, X(5) + 660, 690, 'openings');
piece(own(top_, 5), 'wn', X(5) + 0, 2330, 540, true);

phone(phones, X(6) + 660, 690, 'exercises');
piece(own(top_, 6), 'wr', X(6) + 0, 2470, 420);
piece(own(top_, 6), 'bb', X(6) + 925, 2360, 520);

rose(own(back, 7), X(7) + 1090, 1030, 360);
phone(phones, X(7) + 660, 690, 'atlas');
const small = tube(own(top_, 7), `M${X(7) + 120} 2960C${X(7) + 110} 2700 ${X(7) + 150} 2520 ${X(7) + 290} 2460`, u => 130 - 30 * u, -1);
head(own(top_, 7), small.end, small.endT, 0.95);

phone(phones, X(8) + 660, 690, 'profile');
shield(own(top_, 8), X(8) + 880, 2330, 420);

svg.append(back, phones, front, sea, top_);

// ---------- captions ----------
const stage = document.getElementById('stage');
stage.style.left = -SLIDE * W + 'px';
const md = s => s.replace(/\*(.+?)\*/g, '<b>$1</b>').replace('|', '<br>');
TEXT.forEach(([h, p], i) => {
  const c = document.createElement('div');
  c.className = 'cap' + (i ? '' : ' hero');
  c.style.left = i * W + 'px';
  c.innerHTML = (i ? '' : '<img src="../brand/logo/wordmark-tin.svg">') + `<h1>${md(h)}</h1><p>${p}</p>`;
  stage.appendChild(c);
});
document.fonts.ready.then(() => {
  for (const h of document.querySelectorAll('.cap:not(.hero) h1')) {
    let size = 150;
    while (h.offsetHeight > size * 2.05 && size > 90) { size -= 4; h.style.fontSize = size + 'px'; }
  }
});
</script>
